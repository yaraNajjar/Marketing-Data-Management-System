---
spring:
  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: validate

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/company?serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
token:
  signing:
    key: ${JWT_SIGNING_KEY}
logging:
  level:
    org.springframework.security: DEBUG
server:
  port: 8080
