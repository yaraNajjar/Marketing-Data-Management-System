services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: campaign-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - campaign_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  security:
      image: campaign-security:local
      container_name: campaign-security
      ports:
        - "127.0.0.1:8080:8080"
      environment:
        DB_URL: "jdbc:mysql://host.docker.internal:3306/company?serverTimezone=UTC"
        DB_USERNAME: "${DB_USERNAME}"
        DB_PASSWORD: "${DB_PASSWORD}"
        JWT_SIGNING_KEY: "${JWT_SIGNING_KEY}"
        SPRING_SQL_INIT_MODE: never
        SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      restart: "no"

  actions:
    image: campaign-actions:local
    container_name: campaign-actions
    depends_on:
      kafka:
        condition: service_healthy
      security:
        condition: service_started
    ports:
      - "127.0.0.1:9097:9097"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/actions?useSSL=false&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${DB_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      SERVICES_SECURITY_URL: "http://security:8080"
    restart: "no"

  loaders:
    image: campaign-loaders:local
    container_name: campaign-loaders
    depends_on:
      security:
        condition: service_started
    ports:
      - "127.0.0.1:9091:9091"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/marketing_data?useSSL=false&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${DB_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"
      SERVICES_SECURITY_URL: "http://security:8080"
    restart: "no"

  metrics:
    image: campaign-metrics:local
    container_name: campaign-metrics
    depends_on:
      actions:
        condition: service_started
      security:
        condition: service_started
    ports:
      - "127.0.0.1:9096:9096"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/metrics?useSSL=false&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${DB_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"
      SERVICES_ACTIONS_URL: "http://actions:9097/controller_action"
      SERVICES_SECURITY_URL: "http://security:8080"
    restart: "no"

  jobsscheduler:
    image: campaign-jobsscheduler:local
    container_name: campaign-jobsscheduler
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      JOBS_DB_URL: "jdbc:mysql://host.docker.internal:3306/actions?useSSL=false&serverTimezone=UTC"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
    restart: "no"

  worker:
    image: campaign-worker:local
    container_name: campaign-worker
    depends_on:
      kafka:
        condition: service_healthy
      loaders:
        condition: service_started
      metrics:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/marketing_data?useSSL=false&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${DB_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      SERVICES_LOADERS_URL: "http://loaders:9091/controller_loader"
      SERVICES_METRICS_URL: "http://metrics:9096/controller_metric"
    restart: "no"
  
  mailkafkaconsumer:
    image: campaign-mailkafkaconsumer:local
    container_name: campaign-mailkafkaconsumer
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      MAIL_USERNAME: "${MAIL_USERNAME}"
      MAIL_PASSWORD: "${MAIL_PASSWORD}"
    restart: "no"

  smskafkaconsumer:
    image: campaign-smskafkaconsumer:local
    container_name: campaign-smskafkaconsumer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN}"
      TWILIO_PHONE_NUMBER: "${TWILIO_PHONE_NUMBER}"
    restart: "no"

  whatsappkafkaconsumer:
    image: campaign-whatsappkafkaconsumer:local
    container_name: campaign-whatsappkafkaconsumer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN}"
      TWILIO_PHONE_NUMBER: "${TWILIO_PHONE_NUMBER}"
    restart: "no"

  smartpostai:
    image: campaign-smartpostai:local
    container_name: campaign-smartpostai
    ports:
      - "127.0.0.1:4040:4040"
    environment:
      SMARTPOST_DB_URL: "jdbc:mysql://host.docker.internal:3306/company?useSSL=false&serverTimezone=UTC"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
    restart: "no"

  gateway:
    image: campaign-apigateway:local
    container_name: campaign-gateway
    depends_on:
      jobsscheduler:
        condition: service_started
      loaders:
        condition: service_started
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      COUPON_SERVICE_URL: "http://jobsscheduler:9090"
      IDENTITY_SERVICE_URL: "http://loaders:9091"
      GATEWAY_JWT_SIGNING_KEY: "${GATEWAY_JWT_SIGNING_KEY}"
    restart: "no"

  client:
    image: campaign-client:local
    container_name: campaign-client
    ports:
      - "127.0.0.1:3000:80"
    restart: "no"

volumes:
  campaign_kafka_data:


