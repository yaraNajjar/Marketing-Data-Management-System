---
spring:
  application:
    name: metrics
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/metrics?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
  servlet:
    multipart:
      enabled: true
server:
  port: 9096
